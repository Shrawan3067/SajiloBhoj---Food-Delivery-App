services:
  - type: web
    name: bitexpress-server
    env: node
    buildCommand: npm install
    startCommand: node index.js
    nodeVersion: "18"
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 5001
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/ping
    autoDeploy: true
